
{% extends "base.html" %}

{% block content %}

<h1>Add a New Class</h1>

<p>Enter the class details and assignment weights.</p>

{% if message %}
    <p style="color: {{ 'green' if success else 'red' }};">
        {{ message }}
    </p>
{% endif %}

<form method="POST">

    <label>Class Name:</label>

    <input
        type="text"
        name="class_name"
        placeholder="e.g., CS 180"
        value="{{ request.form.get('class_name', '') }}"
        required
    >

    <br><br>

    <table border="1">
        <tr>
            <th>Assignment Type</th>
            <th>Weight (%)</th>
        </tr>

        {% for i in range(1, 9) %}
        <tr>
            <td>
                <input
                    type="text"
                    name="cat_name_{{ i }}"
                    placeholder="e.g., Homework"
                    value="{{ request.form.get('cat_name_' ~ i, '') }}"
                >
            </td>

            <td>
                <input
                    type="number"
                    name="cat_weight_{{ i }}"
                    placeholder="e.g., 30"
                    min="0"
                    max="100"
                    step="any"
                    value="{{ request.form.get('cat_weight_' ~ i, '') }}"
                >
            </td>
        </tr>
        {% endfor %}
    </table>

    <br>

    <button class="button" type="submit">
        Save Class
    </button>

</form>

<br>

<a href="{{ url_for('home') }}" class="button">
    Back to Home
</a>

{% endblock %}
